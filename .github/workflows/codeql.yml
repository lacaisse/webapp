# SPDX-License-Identifier: AGPL-3.0-or-later
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly full scan (Mondays 06:00 UTC) so advisories that land after a PR
    # merges still get surfaced against the default branch.
    - cron: "0 6 * * 1"

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          # `security-and-quality` adds maintainability queries on top of the
          # default security set. Drop to `security-extended` for fewer,
          # higher-severity findings.
          queries: security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.3
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.3
